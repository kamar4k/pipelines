name: Common Deploy Pipeline

on:
  workflow_call:
    inputs:
      service:
        description: 'Name of service'
        required: true
        type: string
      version:
        description: 'Version for deploy (format: build number, e.g.: 1.0.0-1)'
        required: true
        type: string
        default: '1.0.0-1'
      deploy_env:
        description: 'Deploy configuration in yml format'
        required: true
        type: string
      service_env:
        description: 'Service environments in yml format'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Загружаем конфигурацию развертывания
      - name: install yq if not exists
        run: |
          # Устанавливаем yq если нет
          if ! command -v yq &> /dev/null; then
            echo "Installing yq..."
            sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64 -O /usr/bin/yq
            sudo chmod +x /usr/bin/yq
          fi
      - name: Load deployment configuration
        id: load_deploy_config
        run: |
          # Читаем YAML файл
          yaml_content=$(cat "${{ inputs.deploy_env }}")
          
          # Теперь парсим обработанный YAML
          DOCKER_REGISTRY=$(echo "$yaml_content" | yq eval '.DOCKER_REGISTRY')
          REGISTRY_OWNER=$(echo "$yaml_content" | yq eval '.REGISTRY_OWNER')
          SSH_HOST=$(echo "$yaml_content" | yq eval '.SSH_HOST')
          SSH_USERNAME=$(echo "$yaml_content" | yq eval '.SSH_USERNAME')
          SSH_PRIVATE_KEY=$(echo "$yaml_content" | yq eval '.SSH_PRIVATE_KEY')
          REGISTRY_TOKEN=$(echo "$yaml_content" | yq eval '.REGISTRY_TOKEN')
          
          # Проверяем обязательные переменные
          if [ -z "$SSH_HOST" ]; then
            echo "Error: SSH_HOST is not defined in deploy.yml"
            exit 1
          fi
          
          if [ -z "$SSH_USERNAME" ]; then
            echo "Error: SSH_USERNAME is not defined in deploy.yml"
            exit 1
          fi
          
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Error: SSH_PRIVATE_KEY is not defined in deploy.yml"
            exit 1
          fi
          
          echo "SSH_HOST: ${SSH_HOST:0:10}..."  # Логируем частично для безопасности
          echo "SSH_USERNAME: $SSH_USERNAME"
          echo "DOCKER_REGISTRY: $DOCKER_REGISTRY"
          
          # Сохраняем в outputs
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_OUTPUT
          echo "SSH_USERNAME=$SSH_USERNAME" >> $GITHUB_OUTPUT
          echo "REGISTRY_TOKEN=$REGISTRY_TOKEN" >> $GITHUB_OUTPUT
          echo "REGISTRY_OWNER=$REGISTRY_OWNER" >> $GITHUB_OUTPUT
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY" >> $GITHUB_OUTPUT
          
          # Сохраняем приватный ключ
          echo "$SSH_PRIVATE_KEY" > /tmp/ssh_private_key
          chmod 600 /tmp/ssh_private_key

      # Загружаем переменные окружения приложения
      - name: Load environment variables
        id: load_env_vars
        run: |
          # Конвертируем YAML в формат ключ=значение с обработкой секретов
          ENV_CONTENT=$(echo "${{ inputs.service_env }}" | yq eval 'to_entries | .[] | .key + "=" + .value')
          
          # Сохраняем в файл для использования в дальнейшем
          echo "$ENV_CONTENT" > /tmp/app_env_vars
          echo "ENV_CONTENT<<EOF" >> $GITHUB_OUTPUT
          echo "$ENV_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Настройка SSH для подключения к целевому серверу
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          cp /tmp/ssh_private_key ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ steps.load_deploy_config.outputs.SSH_HOST }}" >> ~/.ssh/known_hosts

      # Деплой на удаленный сервер
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.load_deploy_config.outputs.SSH_HOST }}
          username: ${{ steps.load_deploy_config.outputs.SSH_USERNAME }}
          key_path: /tmp/ssh_private_key
          script: |
            # Авторизация в Docker Registry
            echo "${{ steps.load_deploy_config.outputs.REGISTRY_TOKEN }}" | docker login ${{ steps.load_deploy_config.outputs.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Останавливаем и удаляем старый контейнер
            docker stop ${{ inputs.service }} || true
            docker rm ${{ inputs.service }} || true
            
            # Создаем директории
            mkdir -p /opt/${{ inputs.service }}/config
            mkdir -p /opt/${{ inputs.service }}/logs
            
            # Создаем файл с переменными окружения
            cat > /opt/${{ inputs.service }}/config/.env << 'EOF'
            ${{ steps.load_env_vars.outputs.ENV_CONTENT }}
            ENVIRONMENT=${{ inputs.environment }}
            VERSION=${{ inputs.version }}
            SERVICE=${{ inputs.service }}
            EOF
            
            # Запускаем новый контейнер
            docker run -d \
              --name ${{ inputs.service }} \
              --restart unless-stopped \
              --env-file /opt/${{ inputs.service }}/config/.env \
              -v /opt/${{ inputs.service }}/logs:/app/logs \
              ${{ steps.load_deploy_config.outputs.DOCKER_REGISTRY }}/${{ steps.load_deploy_config.outputs.REGISTRY_OWNER }}/${{ inputs.service }}:${{ inputs.version }}
            
            # Очистка старых образов
            docker image prune -f

      # Проверка успешности деплоя
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.load_deploy_config.outputs.SSH_HOST }}
          username: ${{ steps.load_deploy_config.outputs.SSH_USERNAME }}
          key_path: /tmp/ssh_private_key
          script: |
            sleep 30
            
            echo "=== Docker Container Status ==="
            docker ps --filter "name=$${{ inputs.service }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Recent Logs ==="
            docker logs ${{ inputs.service }} --tail 20
            
            echo "=== Container Health ==="
            docker inspect ${{ inputs.service }} --format='{{.State.Health.Status}}' 2>/dev/null || echo "No healthcheck configured"
            
            echo "=== Resource Usage ==="
            docker stats ${{ inputs.service }} --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" || true